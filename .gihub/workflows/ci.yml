name: CI Pipeline

# Step 2 Trigger setup: Run whenever code is pushed to any branch
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest  # Spawns a clean Linux runner

    steps:
      # Step A: Pull code from your branch into the runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step B: Run orchestrator verification steps
      - name: Run a test script
        run: |
          echo "Pipeline orchestration triggered successfully!"
          echo "Running on branch: ${{ github.ref }}"